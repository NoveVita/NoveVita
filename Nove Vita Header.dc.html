<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  .nvh-link { font-family:'Inter',sans-serif; font-weight:500; font-size:13px; letter-spacing:1.6px; text-transform:uppercase; color:#1F3D33; text-decoration:none; transition:color 220ms ease; position:relative; padding-bottom:4px; }
  .nvh-link:hover { color:#9C7A3F; }
  .nvh-link.active { color:#9C7A3F; }
  .nvh-dark .nvh-link { color:#F8F4EE; }
  .nvh-dark .nvh-link:hover, .nvh-dark .nvh-link.active { color:#E3C588; }
  .nvh-dark .nvh-logo { color:#F8F4EE !important; }
  .nvh-tools { position:relative; }
  .nvh-tools-menu { position:absolute; top:100%; left:50%; transform:translateX(-50%); padding-top:14px; background:transparent; display:none; flex-direction:column; z-index:1201; pointer-events:none; }
  .nvh-tools:hover .nvh-tools-menu, .nvh-tools-menu:hover { display:flex; pointer-events:auto; }
  .nvh-tools-menu-inner { background:#F8F4EE; border-radius:6px; box-shadow:0 16px 32px rgba(31,61,51,0.16); padding:10px; display:flex; flex-direction:column; gap:2px; min-width:170px; }
  .nvh-tools-item { font-family:'Inter',sans-serif; font-weight:500; font-size:12.5px; letter-spacing:0.6px; text-transform:none; color:#1F3D33; text-decoration:none; padding:10px 14px; border-radius:4px; transition:background 180ms ease; }
  .nvh-tools-item:hover { background:rgba(31,61,51,0.06); color:#9C7A3F; }
  .nvh-tools-item.active { color:#9C7A3F; }

  /* ---------- mobile navigation (tap driven, built for touch) ---------- */
  .nvh-burger { display:none; }
  .nvh-m-link.active { color:#9C7A3F !important; }
  @media (max-width: 900px) {
    .nvh-links { display:none !important; }
    .nvh-burger { display:flex !important; }
  }
</style>
</helmet>
<dc-import name="Nove Vita - WhatsApp Button" hint-size="60px,60px"></dc-import>
<header class="{{ darkCls }}" style="position:sticky; top:0; left:0; right:0; z-index:1000; width:100%; box-sizing:border-box; padding:{{ padY }}px 32px; display:flex; align-items:center; justify-content:space-between; background:{{ resolvedBg }}; border-bottom:1px solid rgba(31,61,51,0.16); box-shadow:{{ shadow }}; transition:padding 250ms ease, background 250ms ease, box-shadow 250ms ease;">
  <a href="/" class="nvh-logo" style="font-family:'Playfair Display'; font-weight:500; font-size:19px; letter-spacing:2.5px; color:#1F3D33; text-decoration:none;">NOVÉ VITA</a>
  <nav class="nvh-links" style="display:flex; align-items:center; gap:38px;">
    <a class="{{ homeClass }}" href="/">Home</a>
    <a class="{{ ghkClass }}" href="/ghk-cu">GHK-Cu</a>
    <div class="nvh-tools">
      <span class="{{ toolsClass }}" style="display:inline-block; padding-bottom:4px; cursor:default;">Tools</span>
      <div class="nvh-tools-menu">
        <div class="nvh-tools-menu-inner">
          <a class="{{ toolsCalcClass }}" href="/calculator">Calculator</a>
          <a class="{{ toolsMixingClass }}" href="/mixing">Mixing</a>
          <a class="{{ toolsGhkClass }}" href="/ghk-cu-calculator">GHK-Cu doseren</a>
        </div>
      </div>
    </div>
    <a class="{{ journalClass }}" href="/journal">Journal</a>
    <a class="{{ guidanceClass }}" href="/guidance">Guidance</a>
    <a class="{{ faqClass }}" href="/faq">FAQ</a>
    <a class="{{ contactClass }}" href="/contact">Contact</a>
  </nav>

  <button class="nvh-burger" type="button" onclick="{{ toggleMenu }}" aria-label="{{ menuLabel }}" aria-expanded="{{ menuExpanded }}" style="width:44px; height:44px; margin-right:-8px; align-items:center; justify-content:center; background:none; border:none; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent;">
    <span style="position:relative; display:block; width:22px; height:16px;">
      <span style="position:absolute; left:0; right:0; top:{{ barTop }}; height:1.5px; background:{{ barColor }}; transform:{{ barTopTf }}; transition:transform 260ms ease, top 260ms ease;"></span>
      <span style="position:absolute; left:0; right:0; top:7px; height:1.5px; background:{{ barColor }}; opacity:{{ barMidOpacity }}; transition:opacity 180ms ease;"></span>
      <span style="position:absolute; left:0; right:0; top:{{ barBottom }}; height:1.5px; background:{{ barColor }}; transform:{{ barBottomTf }}; transition:transform 260ms ease, top 260ms ease;"></span>
    </span>
  </button>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav style="position:absolute; top:100%; left:0; right:0; background:#F8F4EE; border-bottom:1px solid rgba(31,61,51,0.10); box-shadow:0 18px 40px rgba(31,61,51,0.16); padding:8px 0 14px; display:flex; flex-direction:column;">
      <a class="{{ mHomeClass }}" href="/" style="font-family:'Inter',sans-serif; font-weight:500; font-size:15px; letter-spacing:1.4px; text-transform:uppercase; color:#1F3D33; text-decoration:none; padding:17px 28px; border-bottom:1px solid rgba(31,61,51,0.07);">Home</a>
      <a class="{{ mGhkClass }}" href="/ghk-cu" style="font-family:'Inter',sans-serif; font-weight:500; font-size:15px; letter-spacing:1.4px; text-transform:uppercase; color:#1F3D33; text-decoration:none; padding:17px 28px; border-bottom:1px solid rgba(31,61,51,0.07);">GHK-Cu</a>

      <button type="button" onclick="{{ toggleTools }}" aria-expanded="{{ toolsExpanded }}" style="display:flex; align-items:center; justify-content:space-between; gap:12px; width:100%; background:none; border:none; border-bottom:1px solid rgba(31,61,51,0.07); font-family:'Inter',sans-serif; font-weight:500; font-size:15px; letter-spacing:1.4px; text-transform:uppercase; color:{{ mToolsColor }}; text-align:left; padding:17px 28px; cursor:pointer; -webkit-tap-highlight-color:transparent;">
        <span>Tools</span>
        <span style="font-family:'Inter',sans-serif; font-weight:400; font-size:17px; line-height:1; color:#9C7A3F; transform:{{ chevronTf }}; transition:transform 240ms ease;">&#8250;</span>
      </button>
      <sc-if value="{{ toolsOpen }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex; flex-direction:column; background:#EFE8DE; border-bottom:1px solid rgba(31,61,51,0.07);">
          <a class="{{ mCalcClass }}" href="/calculator" style="font-family:'Inter',sans-serif; font-weight:500; font-size:14.5px; letter-spacing:0.4px; color:#1F3D33; text-decoration:none; padding:15px 28px 15px 40px;">Calculator</a>
          <a class="{{ mMixingClass }}" href="/mixing" style="font-family:'Inter',sans-serif; font-weight:500; font-size:14.5px; letter-spacing:0.4px; color:#1F3D33; text-decoration:none; padding:15px 28px 15px 40px;">Mixing</a>
          <a class="{{ mGhkCalcClass }}" href="/ghk-cu-calculator" style="font-family:'Inter',sans-serif; font-weight:500; font-size:14.5px; letter-spacing:0.4px; color:#1F3D33; text-decoration:none; padding:15px 28px 15px 40px;">GHK-Cu doseren</a>
        </div>
      </sc-if>

      <a class="{{ mJournalClass }}" href="/journal" style="font-family:'Inter',sans-serif; font-weight:500; font-size:15px; letter-spacing:1.4px; text-transform:uppercase; color:#1F3D33; text-decoration:none; padding:17px 28px; border-bottom:1px solid rgba(31,61,51,0.07);">Journal</a>
      <a class="{{ mGuidanceClass }}" href="/guidance" style="font-family:'Inter',sans-serif; font-weight:500; font-size:15px; letter-spacing:1.4px; text-transform:uppercase; color:#1F3D33; text-decoration:none; padding:17px 28px; border-bottom:1px solid rgba(31,61,51,0.07);">Guidance</a>
      <a class="{{ mFaqClass }}" href="/faq" style="font-family:'Inter',sans-serif; font-weight:500; font-size:15px; letter-spacing:1.4px; text-transform:uppercase; color:#1F3D33; text-decoration:none; padding:17px 28px; border-bottom:1px solid rgba(31,61,51,0.07);">FAQ</a>
      <a class="{{ mContactClass }}" href="/contact" style="font-family:'Inter',sans-serif; font-weight:500; font-size:15px; letter-spacing:1.4px; text-transform:uppercase; color:#1F3D33; text-decoration:none; padding:17px 28px;">Contact</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { scrolled: false, menuOpen: false, toolsOpen: false };
  componentDidMount() {
    this._onScroll = () => {
      const s = window.scrollY > 12;
      if (s !== this.state.scrolled) this.setState({ scrolled: s });
    };
    window.addEventListener('scroll', this._onScroll, { passive: true });
  }
  componentWillUnmount() {
    window.removeEventListener('scroll', this._onScroll);
  }
  renderVals() {
    const active = this.props.active || '';
    const cls = (name) => 'nvh-link' + (active === name ? ' active' : '');
    const mcls = (name) => 'nvh-m-link' + (active === name ? ' active' : '');
    const scrolled = this.state.scrolled;
    const open = this.state.menuOpen;
    const toolsOpen = this.state.toolsOpen;
    const override = this.props.bg;
    const defaultBg = scrolled ? 'rgba(248,245,239,0.96)' : 'rgba(248,245,239,0.88)';
    const toolsActive = active === 'calculator' || active === 'mixing' || active === 'ghk-calc';
    return {
      padY: scrolled ? 14 : 22,
      resolvedBg: override || defaultBg,
      darkCls: this.props.dark ? 'nvh-dark' : '',
      shadow: scrolled ? '0 8px 24px rgba(31,61,51,0.14)' : '0 4px 14px rgba(31,61,51,0.07)',
      homeClass: cls('home'),
      ghkClass: cls('ghk'),
      toolsClass: 'nvh-link' + (toolsActive ? ' active' : ''),
      toolsCalcClass: 'nvh-tools-item' + (active === 'calculator' ? ' active' : ''),
      toolsMixingClass: 'nvh-tools-item' + (active === 'mixing' ? ' active' : ''),
      toolsGhkClass: 'nvh-tools-item' + (active === 'ghk-calc' ? ' active' : ''),
      journalClass: cls('journal'),
      guidanceClass: cls('guidance'),
      faqClass: cls('faq'),
      contactClass: cls('contact'),
      // mobile panel
      mHomeClass: mcls('home'),
      mGhkClass: mcls('ghk'),
      mGhkCalcClass: mcls('ghk-calc'),
      mJournalClass: mcls('journal'),
      mGuidanceClass: mcls('guidance'),
      mFaqClass: mcls('faq'),
      mContactClass: mcls('contact'),
      mCalcClass: mcls('calculator'),
      mMixingClass: mcls('mixing'),
      mToolsColor: toolsActive ? '#9C7A3F' : '#1F3D33',
      menuOpen: open,
      menuExpanded: open ? 'true' : 'false',
      menuLabel: open ? 'Menu sluiten' : 'Menu openen',
      toolsOpen,
      toolsExpanded: toolsOpen ? 'true' : 'false',
      chevronTf: toolsOpen ? 'rotate(90deg)' : 'rotate(0deg)',
      barColor: this.props.dark ? '#F8F4EE' : '#1F3D33',
      barTop: open ? '7px' : '0px',
      barBottom: open ? '7px' : '14px',
      barTopTf: open ? 'rotate(45deg)' : 'none',
      barBottomTf: open ? 'rotate(-45deg)' : 'none',
      barMidOpacity: open ? 0 : 1,
      // Tap driven: no hover, no scroll locking, no scrolling of the page.
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen, toolsOpen: false })),
      toggleTools: () => this.setState(s => ({ toolsOpen: !s.toolsOpen })),
    };
  }
}
</script>
</body>
</html>
