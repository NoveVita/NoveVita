        return {

          availableMg: availableMg, availableClicks: availableClicks,
          clicksPerInjection: Math.round(doseMg * clicksPerMg), usedMg: 0, usedClicks: 0,
          remainingMg: runningMg, remainingClicks: runningMg * clicksPerMg,
          limited: false, skipped: penEmpty, usedWeeks: 0,
          costPerInjection: costPerClick != null ? doseMg * clicksPerMg * costPerClick : null,

          remainingValue: costPerClick != null ? availableClicks * costPerClick : null

      var usedWeeks, usedMg, limited = false;
      if (requestedMg <= runningMg + 1e-9) { usedWeeks = weeks; usedMg = requestedMg; }

      runningMg = remainingMg;
      runningWeek += usedWeeks;
      totalUsedMg += usedMg; totalUsedClicks += usedClicks; totalWeeks += usedWeeks;
      if (remainingMg <= 1e-6) penEmpty = true;
      var row = {
        id: p.id, startWeek: startWeek, endWeek: startWeek + usedWeeks - 1, weeks: weeks, doseMg: doseMg,
        availableMg: availableMg, availableClicks: availableClicks,
        clicksPerInjection: Math.round(doseMg * clicksPerMg), usedMg: usedMg, usedClicks: usedClicks,
        remainingMg: remainingMg, remainingClicks: remainingClicks,
        limited: limited, skipped: false, usedWeeks: usedWeeks,
        costPerInjection: costPerClick != null ? doseMg * clicksPerMg * costPerClick : null,
        phaseCost: costPerClick != null ? usedClicks * costPerClick : null,
        remainingValue: costPerClick != null ? remainingClicks * costPerClick : null
      };
      return row;
    });

    return {
      basePen: basePen, rows: rows, penEmpty: penEmpty, doseList: doseList,
      remainingMg: Math.max(0, runningMg), remainingClicks: Math.round(Math.max(0, runningMg) * clicksPerMg),
      remainingPercent: basePen ? Math.max(0, Math.min(100, (runningMg / basePen.totalMg) * 100)) : 0,
      totalUsedMg: totalUsedMg, totalUsedClicks: totalUsedClicks, totalWeeks: totalWeeks,
      totalUsedValue: costPerClick != null ? totalUsedClicks * costPerClick : null,
      remainingValue: costPerClick != null ? Math.round(Math.max(0, runningMg) * clicksPerMg) * costPerClick : null,
      currency: basePen ? basePen.currency : 'EUR'
    };
  }

  // ---------- render + wire ----------
  function render() {
    document.getElementById('tabCalc').className = 'tab-btn' + (state.view === 'calculator' ? ' active' : '');
    document.getElementById('tabSchema').className = 'tab-btn' + (state.view === 'schema' ? ' active' : '');

    var html = '';
    if (state.view === 'calculator') html = renderCalculatorView();
    else if (state.view === 'schema') html = renderSchemaView();
    else if (state.view === 'admin') html = renderAdminView();
    else if (state.view === 'privacy' || state.view === 'disclaimer' || state.view === 'terms') html = renderLegalView(state.view);
    contentEl.innerHTML = html + renderFooter();
    wireEvents();
  }

  function wireEvents() {
    document.querySelectorAll('.footer-link').forEach(function (link) {
      link.onclick = function (e) {
        e.preventDefault();
        setState({ previousView: state.view === 'privacy' || state.view === 'disclaimer' || state.view === 'terms' ? state.previousView : state.view, view: link.getAttribute('data-legal') });
      };
    });
    var backBtn = document.getElementById('legalBackBtn');
    if (backBtn) backBtn.onclick = function () { setState({ view: state.previousView || 'calculator' }); };

    if (state.view === 'calculator') {
      var medR = document.getElementById('medRetatrutide');
      var medM = document.getElementById('medMounjaro');
      if (medR) medR.onclick = function () {
        var firstPen = state.pens.filter(function (p) { return p.active && p.medicine === 'retatrutide'; })[0];
        setState({ medicine: 'retatrutide', selectedPenId: firstPen ? firstPen.id : state.selectedPenId, selectedDose: null });
      };
      if (medM) medM.onclick = function () {
        var firstPen = state.pens.filter(function (p) { return p.active && p.medicine === 'mounjaro'; })[0];
        setState({ medicine: 'mounjaro', selectedPenId: firstPen ? firstPen.id : state.selectedPenId, selectedDose: null });
      };

      var penSelect = document.getElementById('penSelect');
      if (penSelect) penSelect.onchange = function (e) { setState({ selectedPenId: e.target.value, selectedDose: null }); };

      var slider = document.getElementById('doseSlider');
      if (slider) slider.oninput = function (e) { setState({ selectedDose: toNum(e.target.value) }); };

      var doseBtns = document.querySelectorAll('.dose-btn[data-dose]');
      doseBtns.forEach(function (btn) {
        if (btn.disabled) return;
        btn.onclick = function () { setState({ selectedDose: toNum(btn.getAttribute('data-dose')) }); };
      });

      var resetBtn = document.getElementById('resetBtn');
      if (resetBtn) resetBtn.onclick = function () { setState({ selectedDose: null }); };

      var faqBtns = document.querySelectorAll('.faq-q');
      faqBtns.forEach(function (btn) {
        btn.onclick = function () {
          var i = parseInt(btn.getAttribute('data-faq'), 10);
          setState({ faqOpen: state.faqOpen === i ? null : i });
        };
      });
    } else if (state.view === 'schema') {
      var addBtn = document.getElementById('addPhaseBtn');
      if (addBtn) addBtn.onclick = function () {
        var phases = state.phases.concat([{ id: state.nextPhaseId, weeks: 4, doseMg: 1 }]);
        setState({ phases: phases, nextPhaseId: state.nextPhaseId + 1 });
      };
      document.querySelectorAll('.phase-remove').forEach(function (btn) {
        btn.onclick = function () {
          if (state.phases.length <= 1) return;
          var id = parseInt(btn.getAttribute('data-phase'), 10);
          setState({ phases: state.phases.filter(function (p) { return p.id !== id; }) });
        };
      });
      document.querySelectorAll('.phase-weeks').forEach(function (input) {
        input.onchange = function () {
          var id = parseInt(input.getAttribute('data-phase'), 10);
          var v = toNum(input.value);
          setState({ phases: state.phases.map(function (p) { return p.id === id ? Object.assign({}, p, { weeks: v }) : p; }) });
        };
      });
      document.querySelectorAll('.phase-dose').forEach(function (select) {
        select.onchange = function () {
          var id = parseInt(select.getAttribute('data-phase'), 10);
          var v = toNum(select.value);
          setState({ phases: state.phases.map(function (p) { return p.id === id ? Object.assign({}, p, { doseMg: v }) : p; }) });
        };
      });
    } else if (state.view === 'admin') {
      var startAddBtn = document.getElementById('startAddBtn');
      if (startAddBtn) startAddBtn.onclick = function () {
        setState({
          editingId: 'new', adminError: '',
          draft: { id: null, name: '', brand: '', totalMg: '', totalClicks: '', price: '', currency: 'EUR', minDose: '', maxDose: '', allowedDoses: [], verified: false, verificationNote: '', active: true, allowRounding: false }
        });
      };
      document.querySelectorAll('.pen-edit').forEach(function (btn) {
        btn.onclick = function () {
          var pen = state.pens.filter(function (p) { return p.id === btn.getAttribute('data-pen'); })[0];
          if (!pen) return;
          setState({
            editingId: pen.id, adminError: '',
            draft: {
              id: pen.id, name: pen.name, brand: pen.brand,
              totalMg: pen.totalMg == null ? '' : String(pen.totalMg),
              totalClicks: pen.totalClicks == null ? '' : String(pen.totalClicks),
              price: pen.price == null ? '' : String(pen.price),
              currency: pen.currency, minDose: pen.minDose == null ? '' : String(pen.minDose),
              maxDose: pen.maxDose == null ? '' : String(pen.maxDose),
              allowedDoses: pen.allowedDoses.slice(), verified: pen.verified,
              verificationNote: pen.verificationNote || '', active: pen.active, allowRounding: !!pen.allowRounding
            }
          });
        };
      });
      document.querySelectorAll('.pen-toggle').forEach(function (btn) {
        btn.onclick = function () {
          var id = btn.getAttribute('data-pen');
          var pens = state.pens.map(function (p) { return p.id === id ? Object.assign({}, p, { active: !p.active }) : p; });
          savePens(pens);
          setState({ pens: pens });
        };
      });

      var cancelBtn = document.getElementById('cancelEditBtn');
      if (cancelBtn) cancelBtn.onclick = function () { setState({ editingId: null, draft: null, adminError: '' }); };

      function bindDraftField(id, field) {
        var el = document.getElementById(id);
        if (el) el.oninput = function () {
          var d = Object.assign({}, state.draft);
          d[field] = el.value;
          setState({ draft: d });
        };
      }
      bindDraftField('draftName', 'name');
      bindDraftField('draftBrand', 'brand');
      bindDraftField('draftTotalMg', 'totalMg');
      bindDraftField('draftTotalClicks', 'totalClicks');
      bindDraftField('draftPrice', 'price');
      bindDraftField('draftMinDose', 'minDose');
      bindDraftField('draftMaxDose', 'maxDose');
      bindDraftField('draftVerificationNote', 'verificationNote');
      var currencyEl = document.getElementById('draftCurrency');
      if (currencyEl) currencyEl.onchange = function () {
        var d = Object.assign({}, state.draft); d.currency = currencyEl.value; setState({ draft: d });
      };
      ['draftVerified', 'draftActive', 'draftAllowRounding'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el) el.onchange = function () {
          var field = id.replace('draft', '');
          field = field.charAt(0).toLowerCase() + field.slice(1);
          var d = Object.assign({}, state.draft); d[field] = el.checked; setState({ draft: d });
        };
      });
      document.querySelectorAll('.dose-toggle').forEach(function (btn) {
        btn.onclick = function () {
          var val = toNum(btn.getAttribute('data-val'));
          var d = Object.assign({}, state.draft);
          var has = d.allowedDoses.indexOf(val) !== -1;
          d.allowedDoses = has ? d.allowedDoses.filter(function (v) { return v !== val; }) : d.allowedDoses.concat([val]).sort(function (a, b) { return a - b; });
          setState({ draft: d });
        };
      });

      var saveBtn = document.getElementById('saveDraftBtn');
      if (saveBtn) saveBtn.onclick = function () {
        var d = state.draft;
        var totalMg = toNum(d.totalMg);
        var totalClicks = toNum(d.totalClicks);
        var price = d.price === '' ? null : toNum(d.price);
        if (!d.name.trim()) return setState({ adminError: 'Naam is verplicht.' });
        if (totalMg == null || totalMg <= 0) return setState({ adminError: 'Totale inhoud (mg) moet groter zijn dan 0.' });
        if (totalClicks == null || totalClicks <= 0 || Math.round(totalClicks) !== totalClicks) return setState({ adminError: 'Totaal aantal clicks moet een heel getal groter dan 0 zijn.' });
        if (price != null && price <= 0) return setState({ adminError: 'Vul een geldig bedrag hoger dan 0 in.' });
        if (price != null && !d.currency) return setState({ adminError: 'Kies een valuta wanneer een prijs is ingevuld.' });
        var minDose = d.minDose === '' ? null : toNum(d.minDose);
        var maxDose = d.maxDose === '' ? null : toNum(d.maxDose);
        if (minDose != null && maxDose != null && minDose > maxDose) return setState({ adminError: 'Minimum dosis mag niet groter zijn dan maximum dosis.' });
        var existingPen = state.pens.filter(function (p) { return p.id === d.id; })[0];
        var pen = Object.assign({}, existingPen, {
          id: d.id || ('p' + Date.now()), name: d.name.trim(), brand: d.brand.trim(),
          totalMg: totalMg, totalClicks: totalClicks, mgPerClick: totalMg / totalClicks, clicksPerMg: totalClicks / totalMg,
          price: price, currency: d.currency,
          allowedDoses: d.allowedDoses, minDose: minDose, maxDose: maxDose,
          verified: d.verified, verificationNote: d.verificationNote, active: d.active, allowRounding: d.allowRounding,
          medicine: (existingPen && existingPen.medicine) || 'retatrutide',
          calculationType: (existingPen && existingPen.calculationType) || 'fixedClicks'
        });
        var exists = state.pens.some(function (p) { return p.id === pen.id; });
        var pens = exists ? state.pens.map(function (p) { return p.id === pen.id ? pen : p; }) : state.pens.concat([pen]);
        savePens(pens);
        clearTimeout(savedMsgTimer);
        setState({ pens: pens, editingId: null, draft: null, adminError: '', savedMessage: 'Pen bijgewerkt' });
        savedMsgTimer = setTimeout(function () { setState({ savedMessage: '' }); }, 2500);
      };
    }
  }

  document.getElementById('gearBtn').onclick = function () { setState({ view: 'admin' }); };
  document.getElementById('tabCalc').onclick = function () { setState({ view: 'calculator' }); };
  document.getElementById('tabSchema').onclick = function () { setState({ view: 'schema' }); };

  render();
})();
</script>
</body>
</html>
